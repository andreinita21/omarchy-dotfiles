%YAML 1.3
# Generated by omaoptions — do not edit by hand.
# Change settings in the OmaOptions bar panel or ~/.config/omarchy/omaoptions/config.json,
# then run `omaoptions apply`. Solaar's own GUI would overwrite this file.
---
- {Device: MX Master 3S}
- {Feature: THUMB WHEEL}
- Test: [thumb_wheel_up, 32]
- Execute: [bash, -lc, 'hyprctl dispatch ''hl.dsp.focus({ workspace = "+1" })''']
...
---
- {Device: MX Master 3S}
- {Feature: THUMB WHEEL}
- Test: [thumb_wheel_down, 32]
- Execute: [bash, -lc, 'hyprctl dispatch ''hl.dsp.focus({ workspace = "-1" })''']
...
---
- {Device: MX Master 3S}
- MouseGesture: []
- Execute: [omarchy-menu, toggle]
...
---
- {Device: MX Master 3S}
- MouseGesture: [Mouse Up]
- Execute: [omarchy-menu, toggle, apps]
...
---
- {Device: MX Master 3S}
- MouseGesture: [Mouse Down]
- Execute: [bash, -lc, hyprctl dispatch 'hl.dsp.workspace.toggle_special("scratchpad")']
...
---
- {Device: MX Master 3S}
- MouseGesture: [Mouse Left]
- Execute: [bash, -lc, 'hyprctl dispatch ''hl.dsp.focus({ workspace = "-1" })''']
...
---
- {Device: MX Master 3S}
- MouseGesture: [Mouse Right]
- Execute: [bash, -lc, 'hyprctl dispatch ''hl.dsp.focus({ workspace = "+1" })''']
...
---
- {Device: MX Keys Mini}
- Key: [Emoji, pressed]
- Execute: [omarchy-shell, shell, toggle, omarchy.emojis]
...
---
- {Device: MX Keys Mini}
- Key: [Screen Capture, pressed]
- Execute: [omarchy-capture-screenshot]
...
---
- {Device: MX Keys Mini}
- Key: [Mute Microphone, pressed]
- Execute: [omarchy-audio-input-mute]
...
